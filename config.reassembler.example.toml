# round_robin — Reassembler (Debian 端)
# 复制为 config.toml，放 round_robin 同目录，直接运行即可

mode = "reassembler"
log = true

[reassembler]
listen = "127.0.0.1"          # 监听地址，默认 127.0.0.1；需要外部访问改 0.0.0.0
ports = "52031-52039"          # 端口范围 或数组 [52031, 52032, ...]（与 splitter 的 tunnel 端口一一对应）
local_target = "127.0.0.1:52040"  # 重组后出站目标（sing-box SOCKS5 入站）
chunk_size = 65535
# data_send_timeout_secs = 30  # DATA 发送超时（秒），超时即重置连接，默认 30
# heartbeat_secs = 60          # 心跳/连接清扫间隔（秒），默认 60
# reorder_window_bytes = 67108864  # 每连接重排窗口字节预算，默认 64MB